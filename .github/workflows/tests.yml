# CI: on every pull request and every push to main, install CPU-only packages and run pytest.
# The tests use synthetic images, so no dataset download or GPU is needed.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scikit-learn imagehash Pillow PyYAML matplotlib pytest
      - run: python -m pytest -q
